<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>얼음 다리 난투</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070d18;overflow:hidden;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#e6eefc;user-select:none;-webkit-user-select:none}
canvas{display:block;cursor:crosshair}
.ov{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;background:radial-gradient(ellipse at 50% 20%,rgba(30,58,100,.94),rgba(5,10,20,.98));z-index:10;overflow:auto}
.ov.dim{background:rgba(4,8,16,.72)}
.hidden{display:none!important}
.panel{width:min(1100px,94vw);padding:32px 28px 26px;margin:auto}
h1{margin:0 0 4px;font-size:34px;letter-spacing:-.5px}
h1 small{font-size:15px;color:#93a9c9;font-weight:500;margin-left:8px}
h2{margin:0 0 6px}
.sub{color:#9fb3d1;margin:0 0 20px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}
.card{background:rgba(15,25,45,.85);border:1.5px solid #24395c;border-radius:14px;padding:14px;cursor:pointer;transition:.15s}
.card:hover{border-color:#5b8bd6;transform:translateY(-2px)}
.card.sel{border-color:#ffd166;box-shadow:0 0 0 3px rgba(255,209,102,.25)}
.card .top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#14141a;font-weight:800;flex:none;border:3px solid #4aa3ff}
.card b{font-size:17px}.role{font-size:12px;color:#9fb3d1}
.card .d{font-size:12.5px;color:#9fb3d1;margin-bottom:6px}
.card ul{margin:0;padding:0;list-style:none;font-size:12.5px;color:#c6d4ea;line-height:1.6}
.card li span{display:inline-block;width:18px;color:#ffd166;font-weight:700}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
.btn{background:#ffd166;color:#1a1a1a;border:0;border-radius:10px;padding:12px 24px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#24395c;color:#e6eefc}
.seg{display:flex;border:1.5px solid #24395c;border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;color:#c6d4ea;padding:10px 16px;cursor:pointer;font-size:14px;font-family:inherit}
.seg button.on{background:#24395c;color:#fff;font-weight:700}
.help{margin-top:18px;font-size:13px;color:#a9bbd6;line-height:1.9;background:rgba(15,25,45,.6);padding:12px 16px;border-radius:10px}
kbd{background:#24395c;border-radius:4px;padding:1px 6px;font-family:inherit;color:#fff;font-size:12px;border-bottom:2px solid #13213a}
.box{background:rgba(10,18,34,.97);border:1.5px solid #24395c;border-radius:16px;width:min(780px,94vw)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}
.it{background:#111d33;border:1.5px solid #24395c;border-radius:10px;padding:10px;cursor:pointer;font-size:13px}
.it:hover{border-color:#5b8bd6}.it.no{opacity:.4;cursor:not-allowed}.it.own{border-color:#3d8b5a;opacity:.6;cursor:default}
.it b{display:block;font-size:14px;margin-bottom:3px}.it .c{color:#ffd166;font-weight:700}
.it .s{color:#9fb3d1;font-size:12px}
.inv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.slot{min-width:110px;padding:8px 10px;border-radius:8px;background:#111d33;border:1.5px dashed #24395c;font-size:12px;color:#c6d4ea;cursor:pointer}
.slot.f{border-style:solid}
.slot.f:hover{border-color:#f87171}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:10px}
td,th{padding:7px 8px;text-align:left;border-bottom:1px solid #1c2c48}
th{color:#9fb3d1;font-weight:600;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu" class="ov"></div>
<div id="shop" class="ov dim hidden"><div class="panel box" id="shopIn"></div></div>
<div id="end" class="ov dim hidden"><div class="panel box" id="endIn"></div></div>
<script>
'use strict';
/* ================= 기본 설정 ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=1280,H=720,DPR=1,SC=.6;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';SC=Math.min((H-60)/1200,W/1500);}
window.addEventListener('resize',resize);resize();
const FONT='system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const MAP_W=6000,LANE_Y1=250,LANE_Y2=1150,MID_Y=700;
const FOUNTAIN=[{x:170,y:MID_Y},{x:MAP_W-170,y:MID_Y}];
const TEAMC=['#4aa3ff','#ff5a5a'];
const TEAMN=['블루 팀','레드 팀'];
const DIFF=[
 {name:'쉬움',react:.5,acc:.2,err:150,dmg:.8,dodge:0,agg:.8},
 {name:'보통',react:.3,acc:.7,err:70,dmg:1,dodge:.35,agg:1},
 {name:'어려움',react:.16,acc:1,err:25,dmg:1.12,dodge:.8,agg:1.25}];
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function norm(dx,dy){const d=Math.hypot(dx,dy);if(d<.001)return[1,0];return[dx/d,dy/d];}
function aimDir(u,tx,ty){const v=norm(tx-u.x,ty-u.y);if(Math.abs(tx-u.x)<.001&&Math.abs(ty-u.y)<.001)return[u.team?-1:1,0];return v;}
function clampPt(u,tx,ty,r){const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy);return d<=r?[tx,ty]:[u.x+dx/d*r,u.y+dy/d*r];}
function clampMap(x,y,r){return[clamp(x,40,MAP_W-40),clamp(y,LANE_Y1+r*.6,LANE_Y2-r*.6)];}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
const S=(u,b,l)=>b+l*(u.level-1);

/* ================= 영웅 ================= */
const ROLE={tank:'탱커',mage:'마법사',adc:'원거리 딜러',fighter:'전사',assassin:'암살자',support:'서포터'};
const BASES={
 tank:{hp:690,hpL:112,ad:60,adL:3.5,df:38,dfL:4.2,as:.65,asL:.015,ms:340,range:150},
 mage:{hp:540,hpL:92,ad:52,adL:3,df:22,dfL:3.6,as:.63,asL:.012,ms:330,range:550},
 adc:{hp:560,hpL:95,ad:62,adL:3.6,df:24,dfL:3.6,as:.68,asL:.03,ms:330,range:575},
 fighter:{hp:660,hpL:108,ad:66,adL:4,df:34,dfL:4.2,as:.65,asL:.02,ms:345,range:175},
 assassin:{hp:580,hpL:96,ad:64,adL:3.6,df:28,dfL:4,as:.67,asL:.022,ms:350,range:150},
 support:{hp:560,hpL:95,ad:50,adL:3,df:26,dfL:3.6,as:.62,asL:.012,ms:335,range:525}};
function HD(o){return Object.assign({},BASES[o.role],o);}
const HEROES=[
HD({id:'graff',name:'그라프',role:'tank',color:'#a8b4c4',desc:'사슬로 적을 끌어와 묶는 탱커',ab:[
 {n:'사슬 갈고리',cd:14,desc:'사슬을 던져 처음 맞은 적에게 피해를 주고 내 앞으로 끌어와 기절시킵니다.',ai:{t:'shot',range:1050,speed:1800,w:68},
  cast(u,tx,ty){const[dx,dy]=aimDir(u,tx,ty);proj({owner:u,x:u.x,y:u.y,dx,dy,speed:1800,range:1050,r:34,color:'#dbe3ee',chain:true,onHit(t){dmg(u,t,S(u,70,22)+u.ap*.9+u.ad*.2,'m');const[nx,ny]=norm(t.x-u.x,t.y-u.y);dashTo(t,u.x+nx*(u.r+t.r+10),u.y+ny*(u.r+t.r+10),2200,null,true);stun(t,.65);}});}},
 {n:'과부하',cd:16,desc:'3초간 이동 속도가 크게 오르고 보호막을 얻습니다.',ai:{t:'engage',r:850},
  cast(u){buff(u,'ms',.45,3);shield(u,S(u,60,18)+u.maxHp*.08,3);fx('ring',u.x,u.y,{r:90,c:'#93c5fd'});}},
 {n:'지면 강타',cd:9,desc:'주변 적을 띄워 올리고 피해를 줍니다.',ai:{t:'self',r:260},
  cast(u){aoeNow(u,u.x,u.y,260,t=>{dmg(u,t,S(u,45,16)+u.ad*.6,'p');stun(t,.75);},'#cbd5e1');}},
 {n:'정전기장',cd:70,desc:'넓은 범위에 전기 충격을 일으켜 큰 피해를 주고 둔화시킵니다.',ai:{t:'self',r:520},
  cast(u){aoeNow(u,u.x,u.y,560,t=>{dmg(u,t,S(u,220,28)+u.ap+u.maxHp*.05,'m');slow(t,.5,1.5);},'#fde047');}}]}),
HD({id:'solin',name:'솔린',role:'mage',color:'#fde68a',desc:'빛으로 묶고 멀리서 레이저를 쏘는 마법사',ab:[
 {n:'빛의 속박',cd:11,desc:'빛 구체를 날려 최대 2명을 속박하고 피해를 줍니다.',ai:{t:'shot',range:1150,speed:1300,w:76},
  cast(u,tx,ty){const[dx,dy]=aimDir(u,tx,ty);proj({owner:u,x:u.x,y:u.y,dx,dy,speed:1300,range:1150,r:38,pierce:2,color:'#fef08a',onHit(t){dmg(u,t,S(u,80,26)+u.ap*.6,'m');root(t,1.6);}});}},
 {n:'빛의 장막',cd:14,desc:'자신과 주변 아군에게 보호막을 씌웁니다.',ai:{t:'shieldAura',r:550},
  cast(u){for(const a of alliesIn(u.team,u.x,u.y,550)){shield(a,S(u,65,16)+u.ap*.35,2.5);fx('ring',a.x,a.y,{r:70,c:'#fde68a'});}}},
 {n:'광휘 지대',cd:10,desc:'지정 위치에 빛을 떨어뜨려 잠시 후 폭발, 피해와 둔화를 줍니다.',ai:{t:'aoe',range:1000,r:300,delay:.6,wc:1},
  cast(u,tx,ty){const[x,y]=clampPt(u,tx,ty,1000);zone({owner:u,x,y,r:300,delay:.6,color:'#fde68a',onTrigger(ts){for(const t of ts){dmg(u,t,S(u,75,26)+u.ap*.7,'m');slow(t,.4,1.5);}}});}},
 {n:'섬광',cd:50,desc:'잠시 후 아주 긴 직선 레이저를 발사해 맞은 모든 적에게 큰 피해를 줍니다.',ai:{t:'line',range:2800,delay:.8,w:120},
  cast(u,tx,ty){const[dx,dy]=aimDir(u,tx,ty);zone({owner:u,line:true,x:u.x,y:u.y,x2:u.x+dx*2800,y2:u.y+dy*2800,w:120,delay:.8,color:'#fff7ae',onTrigger(ts){for(const t of ts)dmg(u,t,S(u,280,32)+u.ap,'m');}});}}]}),
HD({id:'kaira',name:'카이라',role:'adc',color:'#bef264',desc:'화살로 견제하고 초장거리 저격을 하는 사수',ab:[
 {n:'신비한 화살',cd:5,desc:'화살을 쏴 피해를 줍니다. 적중 시 다른 스킬 재사용 대기시간이 1초 줄어듭니다.',ai:{t:'shot',range:1150,speed:2000,w:56,wc:1},
  cast(u,tx,ty){const[dx,dy]=aimDir(u,tx,ty);proj({owner:u,x:u.x,y:u.y,dx,dy,speed:2000,range:1150,r:28,color:'#d9f99d',onHit(t){dmg(u,t,S(u,35,16)+u.ad*1.2,'p');for(let i=1;i<4;i++)u.cds[i]=Math.max(0,u.cds[i]-1);}});}},
 {n:'연발 사격',cd:10,desc:'부채꼴로 화살 7발을 쏴 피해를 주고 둔화시킵니다.',ai:{t:'shot',range:900,speed:1700,w:40,cone:1,wc:1},
  cast(u,tx,ty){const a0=Math.atan2(ty-u.y,tx-u.x);const hs=new Set();for(let i=-3;i<=3;i++){const a=a0+i*.12;proj({owner:u,x:u.x,y:u.y,dx:Math.cos(a),dy:Math.sin(a),speed:1700,range:900,r:20,color:'#ecfccb',shared:hs,onHit(t){dmg(u,t,S(u,25,11)+u.ad*.8,'p');slow(t,.3,1.5);}});}}},
 {n:'질풍 이동',cd:15,desc:'짧은 거리를 순간이동합니다.',ai:{t:'dash',range:450},
  cast(u,tx,ty){if(u.cc.root>0)return false;const[x,y]=clampPt(u,tx,ty,450);blink(u,x,y);}},
 {n:'관통 화살',cd:60,desc:'맵을 가로지르는 거대한 화살. 맞은 모든 적에게 피해를 주고 처음 맞은 영웅을 기절시킵니다.',ai:{t:'global',range:3500,speed:1600,w:140},
  cast(u,tx,ty){const[dx,dy]=aimDir(u,tx,ty);let first=true;proj({owner:u,x:u.x,y:u.y,dx,dy,speed:1600,range:6000,r:70,pierce:99,color:'#a3e635',big:true,onHit(t){dmg(u,t,S(u,200,26)+u.ad,'m');if(first&&t.kind==='hero'){stun(t,1.4);first=false;}}});}}]}),
HD({id:'valkan',name:'바르칸',role:'fighter',color:'#fbbf24',desc:'돌면서 베고 마무리 일격을 날리는 전사',ab:[
 {n:'결정타',cd:8,desc:'잠시 빨라지고, 다음 기본 공격이 추가 피해를 주며 적을 크게 둔화시킵니다.',ai:{t:'engage',r:500},
  cast(u){buff(u,'ms',.35,1.6);buff(u,'emp',S(u,35,16)+u.ad*.5,4,{slow:.6});fx('ring',u.x,u.y,{r:60,c:'#fbbf24'});}},
 {n:'인내',cd:18,desc:'3초간 받는 피해가 40% 줄어듭니다.',ai:{t:'dr'},
  cast(u){buff(u,'dr',.4,3);fx('ring',u.x,u.y,{r:70,c:'#fbbf24'});}},
 {n:'회전베기',cd:9,desc:'3초간 회전하며 주변 적에게 계속 피해를 줍니다.',ai:{t:'self',r:300,wc:1},
  cast(u){buff(u,'spin',0,3,{r:300,tick:0,int:.5,dmgF:()=>S(u,16,6)+u.ad*.38,col:'#fbbf24'});}},
 {n:'심판',cd:60,desc:'적 영웅 하나에게 잃은 체력에 비례한 고정 피해를 줍니다. 마무리용.',ai:{t:'exec',range:420},
  est(u,t){return S(u,160,22)+(t.maxHp-t.hp)*.33;},
  cast(u,tx,ty){const t=pickTarget(u,tx,ty,420,true);if(!t)return false;const a=this.est(u,t);fx('beam',u.x,u.y,{x2:t.x,y2:t.y,c:'#fde047',w:30});fx('ring',t.x,t.y,{r:110,c:'#fde047'});dmg(u,t,a,'t');}}]}),
HD({id:'niya',name:'니야',role:'assassin',color:'#d8b4fe',desc:'파고들어 연속으로 베는 암살자',ab:[
 {n:'그림자 돌진',cd:8,desc:'대상에게 순식간에 돌진해 피해를 줍니다. 대상을 처치하면 재사용 대기시간이 초기화됩니다.',ai:{t:'target',range:600},
  cast(u,tx,ty){if(u.cc.root>0)return false;const t=pickTarget(u,tx,ty,600,false);if(!t)return false;dashTo(u,t.x,t.y,2400,()=>{if(t.dead)return;dmg(u,t,S(u,60,22)+u.ad*.75,'p');if(t.dead)u.cds[0]=.2;},false,t);}},
 {n:'칼날 폭풍',cd:7,desc:'주변에 칼날을 흩뿌려 피해를 주고 둔화시킵니다.',ai:{t:'self',r:300,wc:1},
  cast(u){aoeNow(u,u.x,u.y,300,t=>{dmg(u,t,S(u,50,20)+u.ad*.6,'p');slow(t,.3,1.2);},'#d8b4fe');}},
 {n:'순보',cd:13,desc:'짧은 거리를 순간이동합니다.',ai:{t:'dash',range:420},
  cast(u,tx,ty){if(u.cc.root>0)return false;const[x,y]=clampPt(u,tx,ty,420);blink(u,x,y);}},
 {n:'죽음의 연무',cd:55,desc:'2.5초간 주변에 칼날 폭풍을 일으켜 매우 빠르게 피해를 줍니다.',ai:{t:'self',r:420},
  cast(u){buff(u,'spin',0,2.5,{r:450,tick:0,int:.25,dmgF:()=>S(u,26,6)+u.ad*.22,col:'#c084fc'});}}]}),
HD({id:'tera',name:'테라',role:'support',color:'#f9a8d4',desc:'아군을 치유하고 적을 묶는 서포터',ab:[
 {n:'생명의 꽃',cd:9,desc:'체력 비율이 가장 낮은 주변 아군(자신 포함)을 치유하고 이동 속도를 높여줍니다.',ai:{t:'heal',range:750,th:.65},
  cast(u){const as=alliesIn(u.team,u.x,u.y,750);if(!as.length)return false;as.sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp);const a=as[0];heal(a,S(u,70,16)+u.ap*.45);buff(a,'ms',.2,1.5);fx('ring',a.x,a.y,{r:70,c:'#86efac'});}},
 {n:'가시 덩굴',cd:12,desc:'지정 위치에 덩굴을 솟아오르게 해 피해를 주고 속박합니다.',ai:{t:'aoe',range:900,r:260,delay:.7,wc:1},
  cast(u,tx,ty){const[x,y]=clampPt(u,tx,ty,900);zone({owner:u,x,y,r:260,delay:.7,color:'#86efac',onTrigger(ts){for(const t of ts){dmg(u,t,S(u,60,20)+u.ap*.5,'m');root(t,1.25);}}});}},
 {n:'바람의 축복',cd:18,desc:'주변 아군의 이동 속도를 2초간 크게 높입니다.',ai:{t:'engage',r:700},
  cast(u){for(const a of alliesIn(u.team,u.x,u.y,650)){buff(a,'ms',.35,2);fx('ring',a.x,a.y,{r:60,c:'#bae6fd'});}}},
 {n:'대지의 숨결',cd:70,desc:'넓은 범위의 아군을 크게 치유하고 주변 적에게 피해를 줍니다.',ai:{t:'heal',range:800,th:.45},
  cast(u){for(const a of alliesIn(u.team,u.x,u.y,850))heal(a,S(u,150,26)+u.ap*.6);aoeNow(u,u.x,u.y,500,t=>dmg(u,t,S(u,100,15)+u.ap*.4,'m'),'#86efac');fx('ring',u.x,u.y,{r:850,c:'#86efac',dur:.7});}}]})
];
const HMAP={};HEROES.forEach(h=>HMAP[h.id]=h);
const SELF_T=['self','heal','shieldAura','engage','dr'];

/* ================= 아이템 ================= */
const ITEMS={
 boots:{n:'신속의 장화',c:900,ms:45,df:8},
 sword:{n:'강철 장검',c:1100,ad:30},
 dagger:{n:'쾌속 단검',c:900,as:.25},
 bow:{n:'질풍의 활',c:2600,ad:35,as:.35},
 great:{n:'파괴의 대검',c:3000,ad:75},
 tome:{n:'비전 마법서',c:1100,ap:45},
 staff:{n:'심연의 지팡이',c:3000,ap:115},
 orb:{n:'시간의 구슬',c:2500,ap:70,ah:20},

 if(G.tab)drawScore();
 if(G.paused&&!shopOpen){ctx.fillStyle='rgba(4,8,16,.6)';ctx.fillRect(0,0,W,H);txt('일시정지',W/2,H/2-10,40,'#e6eefc','center',900);txt('Esc 키로 계속하기',W/2,H/2+24,15,'#a9bbd6','center');}}
function drawScore(){const w=Math.min(620,W-30),h=330,x=(W-w)/2,y=(H-h)/2-40;rrect(x,y,w,h,14);ctx.fillStyle='rgba(8,14,28,.95)';ctx.fill();ctx.strokeStyle='#24395c';ctx.stroke();
 for(const team of[0,1]){const hs=G.heroes.filter(h=>h.team===team);txt(TEAMN[team]+`  ${G.kills[team]}킬`,x+20,y+32+team*155,15,TEAMC[team],'left',800);
  hs.forEach((h,i)=>{const yy=y+56+team*155+i*24;txt(hname(h)+(h.dead?' (사망)':''),x+30,yy,13,h.isPlayer?'#ffd166':'#e6eefc','left',700);txt('Lv'+h.level,x+w*.38,yy,13,'#c6d4ea');txt(`${h.k} / ${h.d} / ${h.a}`,x+w*.5,yy,13,'#e6eefc','left',700);txt(h.items.map(i=>ITEMS[i].n.slice(0,2)).join(' '),x+w*.66,yy,12,'#9fb3d1');});}}

/* ================= 입력 ================= */
const mouse={sx:0,sy:0,x:0,y:0};let rightDown=false,shopOpen=false;
function playing(){return G&&!G.over&&!G.paused;}
function rightClick(isDrag){const p=G.player;if(p.dead)return;G.aiming=-1;G.amove=false;
 let best=null,bd=1e9;for(const u of G.units){if(!targetable(p,u))continue;const d=Math.hypot(u.x-mouse.x,u.y-mouse.y);if(d<u.r+30&&d<bd){bd=d;best=u;}}
 if(best){p.target=best;p.moveTo=null;p.amove=false;}else{p.target=null;p.moveTo={x:mouse.x,y:mouse.y};p.amove=false;if(!isDrag)fx('click',mouse.x,mouse.y,{c:'#4ade80',dur:.35});}}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousemove',e=>{mouse.sx=e.clientX;mouse.sy=e.clientY;if(rightDown&&playing()){mouse.x=mouse.sx/SC+G.camX;mouse.y=mouse.sy/SC+G.camY;rightClick(true);}});
cv.addEventListener('mousedown',e=>{mouse.sx=e.clientX;mouse.sy=e.clientY;if(!playing())return;mouse.x=mouse.sx/SC+G.camX;mouse.y=mouse.sy/SC+G.camY;const p=G.player;
 if(e.button===2){rightDown=true;rightClick(false);}
 else if(e.button===0){if(G.aiming>=0){tryCast(p,G.aiming,mouse.x,mouse.y);G.aiming=-1;}else if(G.amove&&!p.dead){p.moveTo={x:mouse.x,y:mouse.y};p.amove=true;p.target=null;G.amove=false;fx('click',mouse.x,mouse.y,{c:'#f87171',dur:.35});}}});
window.addEventListener('mouseup',e=>{if(e.button===2)rightDown=false;});
window.addEventListener('blur',()=>{rightDown=false;if(G)G.tab=false;});
const KIDX={KeyQ:0,KeyW:1,KeyE:2,KeyR:3};
window.addEventListener('keydown',e=>{if(!G)return;const c=e.code;
 if(c==='Tab'){e.preventDefault();G.tab=true;return;}
 if(c==='Escape'){if(shopOpen)closeShop();else if(!G.over)G.paused=!G.paused;return;}
 if(c==='KeyP'||c==='KeyB'){if(shopOpen)closeShop();else if(playing())openShop();return;}
 if(!playing())return;const p=G.player;
 if(c in KIDX){e.preventDefault();if(e.repeat||p.dead)return;const i=KIDX[c];if(SELF_T.includes(p.hd.ab[i].ai.t))tryCast(p,i,mouse.x,mouse.y);else G.aiming=i;return;}
 if(c==='KeyD')useSpell(p,'D',mouse.x,mouse.y);
 else if(c==='KeyF')useSpell(p,'F',mouse.x,mouse.y);
 else if(c==='KeyS'){p.target=null;p.moveTo=null;p.amove=false;}
 else if(c==='KeyA')G.amove=true;
 else if(c==='Space'){e.preventDefault();G.camOff=0;}
 else if(c==='ArrowLeft')G.camOff-=400;else if(c==='ArrowRight')G.camOff+=400;});
window.addEventListener('keyup',e=>{if(!G)return;const c=e.code;if(c==='Tab'){G.tab=false;return;}
 if(c in KIDX&&G.aiming===KIDX[c]){if(playing())tryCast(G.player,G.aiming,mouse.x,mouse.y);G.aiming=-1;}});

/* ================= 상점 / 메뉴 / 종료 ================= */
function openShop(){const p=G.player;if(!(p.dead||inBase(p))){banner('기지에 있거나 사망했을 때만 구매할 수 있습니다','#fca5a5',1.8);return;}shopOpen=true;G.paused=true;renderShop();document.getElementById('shop').classList.remove('hidden');}
function closeShop(){shopOpen=false;if(G)G.paused=false;document.getElementById('shop').classList.add('hidden');}
function renderShop(){const p=G.player,el=document.getElementById('shopIn');
 let h=`<h2>상점 <span style="color:#facc15;font-size:18px;margin-left:8px">💰 ${Math.floor(p.gold)}</span></h2><p class="sub" style="margin:0">아이템을 눌러 구매하세요. 보유 아이템을 누르면 70% 가격에 판매합니다. (상점이 열려 있는 동안 게임이 멈춥니다)</p><div class="inv">`;
 for(let i=0;i<6;i++){const id=p.items[i];h+=id?`<div class="slot f" data-sell="${i}"><b>${ITEMS[id].n}</b><br>판매 +${Math.floor(ITEMS[id].c*.7)}</div>`:`<div class="slot">빈 칸</div>`;}
 h+=`</div><div class="items">`;
 for(const[id,it]of Object.entries(ITEMS)){const own=p.items.includes(id),no=!own&&(p.gold<it.c||p.items.length>=6);h+=`<div class="it ${own?'own':no?'no':''}" data-buy="${id}"><b>${it.n}</b><span class="c">${it.c}G</span>${own?' · 보유 중':''}<div class="s">${itemStats(it)}</div></div>`;}
 h+=`</div><div class="row"><button class="btn" id="shopClose">닫기 (P / Esc)</button></div>`;el.innerHTML=h;
 el.querySelectorAll('[data-buy]').forEach(d=>d.onclick=()=>{const id=d.dataset.buy,it=ITEMS[id];if(p.items.includes(id)||p.gold<it.c||p.items.length>=6)return;p.gold-=it.c;p.items.push(id);recalc(p);renderShop();});
 el.querySelectorAll('[data-sell]').forEach(d=>d.onclick=()=>{const i=+d.dataset.sell,id=p.items[i];p.gold+=Math.floor(ITEMS[id].c*.7);p.items.splice(i,1);recalc(p);renderShop();});
 document.getElementById('shopClose').onclick=closeShop;}
let selHero='graff',selDiff=1;
function buildMenu(){const m=document.getElementById('menu');
 let h=`<div class="panel"><h1>얼음 다리 난투<small>5 대 5 · 단일 라인 · AI 대전</small></h1><p class="sub">영웅을 고르고 얼어붙은 다리 위에서 적 넥서스를 파괴하세요. 아군 4명과 적 5명은 무작위로 정해집니다.</p><div class="grid">`;
 for(const d of HEROES)h+=`<div class="card ${selHero===d.id?'sel':''}" data-h="${d.id}"><div class="top"><div class="av" style="background:${d.color}">${d.name[0]}</div><div><b>${d.name}</b><div class="role">${ROLE[d.role]}</div></div></div><div class="d">${d.desc}</div><ul>${d.ab.map((a,i)=>`<li><span>${'QWER'[i]}</span>${a.n}</li>`).join('')}</ul></div>`;
 h+=`<div class="card ${selHero==='random'?'sel':''}" data-h="random"><div class="top"><div class="av" style="background:#e6eefc">?</div><div><b>무작위</b><div class="role">랜덤 감성</div></div></div><div class="d">어떤 영웅이 걸릴지 모릅니다. 원래 이 모드는 이 맛이죠.</div></div>`;
 h+=`</div><div class="row"><span style="color:#9fb3d1;font-size:14px">적 AI 난이도</span><div class="seg">${DIFF.map((d,i)=>`<button data-d="${i}" class="${selDiff===i?'on':''}">${d.name}</button>`).join('')}</div><div style="flex:1"></div><button class="btn" id="go">게임 시작</button></div>
 <div class="help"><b style="color:#e6eefc">조작법</b><br><kbd>우클릭</kbd> 이동·공격 (누른 채 끌면 계속 이동) &nbsp; <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd><kbd>R</kbd> 스킬: 누르고 있으면 조준, 떼면 시전 (조준 중 좌클릭도 시전) &nbsp; <kbd>D</kbd> 점멸 &nbsp; <kbd>F</kbd> 눈덩이, 맞춘 뒤 다시 <kbd>F</kbd>로 돌진<br><kbd>A</kbd>+좌클릭 공격 이동 &nbsp; <kbd>S</kbd> 정지 &nbsp; <kbd>P</kbd> 상점 (기지 또는 사망 시) &nbsp; <kbd>Tab</kbd> 점수판 &nbsp; <kbd>←</kbd><kbd>→</kbd> 카메라 이동, <kbd>Space</kbd> 카메라 복귀 &nbsp; <kbd>Esc</kbd> 일시정지<br>체력은 전투에서 벗어나면 천천히 회복되고, 다리 중앙의 초록 구슬을 먹으면 즉시 회복됩니다. 적 기지 분수대에 들어가면 순식간에 녹습니다. 마우스와 키보드가 있는 PC 환경을 권장합니다.</div></div>`;
 m.innerHTML=h;
 m.querySelectorAll('[data-h]').forEach(c=>c.onclick=()=>{selHero=c.dataset.h;buildMenu();});
 m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{selDiff=+b.dataset.d;buildMenu();});
 document.getElementById('go').onclick=()=>{m.classList.add('hidden');document.getElementById('end').classList.add('hidden');newGame(selHero,selDiff);openShop();};}
function endGame(winner){G.over=true;G.aiming=-1;const win=winner===G.player.team;banner(win?'승리!':'패배',win?'#93c5fd':'#fca5a5',5);
 setTimeout(()=>{const el=document.getElementById('endIn');const mm=Math.floor(G.t/60),ss=Math.floor(G.t%60);
  let h=`<h1 style="color:${win?'#93c5fd':'#fca5a5'}">${win?'승리!':'패배'}</h1><p class="sub">게임 시간 ${mm}분 ${ss}초 · ${TEAMN[0]} ${G.kills[0]} : ${G.kills[1]} ${TEAMN[1]} · 난이도 ${DIFF[G.diff].name}</p><table><tr><th>팀</th><th>영웅</th><th>레벨</th><th>K / D / A</th><th>아이템</th></tr>`;
  for(const hh of G.heroes)h+=`<tr style="${hh.isPlayer?'color:#ffd166;font-weight:700':''}"><td style="color:${TEAMC[hh.team]}">${TEAMN[hh.team]}</td><td>${hname(hh)}</td><td>${hh.level}</td><td>${hh.k} / ${hh.d} / ${hh.a}</td><td style="font-size:12px;color:#9fb3d1">${hh.items.map(i=>ITEMS[i].n).join(', ')}</td></tr>`;
  h+=`</table><div class="row"><button class="btn" id="again">다시 하기</button></div>`;el.innerHTML=h;document.getElementById('end').classList.remove('hidden');
  document.getElementById('again').onclick=()=>{document.getElementById('end').classList.add('hidden');document.getElementById('menu').classList.remove('hidden');buildMenu();};},2200);}

/* ================= 루프 ================= */
let lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;if(G&&!G.paused&&!G.over)update(dt);if(G)render();else{ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#04080f';ctx.fillRect(0,0,W,H);}requestAnimationFrame(frame);}
buildMenu();requestAnimationFrame(frame);
</script>
</body>
</html>
